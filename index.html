<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raphaela Spadi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #171310;
    --surface: #221c17;
    --paper: #efe6d8;
    --paper-dim: #c9beac;
    --wine: #7b2d3b;
    --gold: #a9834b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Work Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    display: flex;
  }

  .layout {
    display: flex;
    width: 100%;
    min-height: 100vh;
  }

  .photo-panel {
    position: relative;
    width: 44%;
    min-height: 100vh;
    overflow: hidden;
    background: var(--surface);
  }

  .photo-panel img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 22%;
    display: block;
  }

  .photo-panel::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(23,19,16,0) 55%, rgba(23,19,16,0.35) 100%);
    pointer-events: none;
  }

  .content-panel {
    width: 56%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 6vw 6vw 5vw;
    position: relative;
  }

  .name {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: clamp(2.6rem, 6vw, 4.6rem);
    line-height: 1.02;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--paper);
  }

  .role {
    margin: 1.3rem 0 0;
    font-size: clamp(1.05rem, 1.6vw, 1.3rem);
    font-weight: 400;
    color: var(--paper-dim);
    max-width: 22ch;
    line-height: 1.4;
  }

  .divider {
    width: 56px;
    height: 2px;
    background: var(--gold);
    border: none;
    margin: 2.4rem 0;
  }

  .social {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    width: fit-content;
    text-decoration: none;
    color: var(--paper);
    font-size: 1rem;
    padding: 0.7rem 0;
    border-bottom: 1px solid rgba(239, 230, 216, 0.25);
    transition: border-color 0.2s ease, color 0.2s ease;
  }

  .social:hover {
    border-color: var(--gold);
    color: var(--gold);
  }

  .social svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  .legal {
    position: absolute;
    left: 6vw;
    bottom: 4vw;
    right: 6vw;
    font-size: 0.8rem;
    color: var(--paper-dim);
    letter-spacing: 0.01em;
  }

  @media (max-width: 820px) {
    .layout { flex-direction: column; }
    .photo-panel { width: 100%; height: 46vh; min-height: 320px; }
    .content-panel { width: 100%; padding: 8vw 7vw 7vw; }
    .legal { position: static; margin-top: 3rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
